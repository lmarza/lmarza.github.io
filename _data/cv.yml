    - title: PhD in Computer Science (cum laude)
      institution: University of Verona, Verona, Italy
      year: 10/2022
      work_title: Advanced Neural Networks Verification for Safe and Explainable Intelligent Systems
      abstract: My thesis proposes novel efficient and reliable methods for verifying and enhancing the correctness of deep neural networks, particularly in the context of Deep Reinforcement Learning (DRL) applications. This work include the list of papers reported in the publications section in the period 2022-2025.
      advisors: Prof. Alessandro Farinelli, Ph.D. and Prof. Ferdinando Cicalese, Ph.D.
      examination committee: Prof. Nils Jansen, Ph.D and Prof. Ezio Bartocci, Ph.D.
  
    - title: M.Sc. in Computer Science and Engineering (110/110 with honors)
      institution: University of Verona, Verona, Italy
      year: 10/2020 - 07/2022
      work_title: Deep Reinforcement Learning for Robotic Tasks Enhancing Efficiency and Safety
      abstract: The work aimed to investigate the improvement in performance of an Deep Reinforcement Learning informed training methodology combining Curriculum Learning, Transfer of Learning and fine-tuning techniques compared to a classic End-to-End uninformed methodology in a mapless navigation context, with a particular focus on the safety aspect. The thesis work has been published at SAC IRMAS, 2022.


